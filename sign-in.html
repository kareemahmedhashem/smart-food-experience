<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | Smart Food</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme auth-page">

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="logo">
                    <i class="fa-solid fa-utensils"></i> Smart<span>Food</span>
                </a>
                <h2>مرحباً بعودتك!</h2>
                <p>سجل دخولك للاستمتاع بأفضل عروض الطعام وتتبع طلباتك بسهولة</p>
            </div>

            <div class="demo-hint">
                حساب تجريبي: <strong>demo@smartfood.com</strong> / <strong>123456</strong>
            </div>

            <form id="login-form" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="email"><i class="fa-solid fa-envelope"></i> البريد الإلكتروني</label>
                    <input type="email" id="email" placeholder="example@domain.com" required>
                    <span class="error-msg" id="email-error"></span>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> كلمة المرور</label>
                    <div class="password-input">
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" id="toggle-password" class="eye-btn">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-msg" id="password-error"></span>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-me">
                        <span>تذكرني</span>
                    </label>
                    <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="btn btn-primary btn-block">دخول حسابي</button>
            </form>

            <div class="divider"><span>أو التسجيل عبر</span></div>

            <div class="social-auth">
                <button class="social-btn google"><i class="fa-brands fa-google"></i> Google</button>
                <button class="social-btn facebook"><i class="fa-brands fa-facebook-f"></i> Facebook</button>
            </div>

            <p class="auth-footer">ليس لديك حساب؟ <a href="index.html#menu">تصفح المأكولات أولاً</a></p>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
